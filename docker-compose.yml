services:
  db:
    image: pgvector/pgvector:0.8.6-pg16

    env_file:
      - backend/.env

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    env_file:
      - backend/.env

    environment:
      POSTGRES_HOST: db
      STORAGE_BACKEND: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}

    ports:
      - "8001:8000"

    volumes:
      - ./backend/data/uploads:/app/data/uploads

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: